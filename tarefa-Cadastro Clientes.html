<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Cliente</title>
  <link rel="stylesheet" href="./estilo.css">
</head>

<body>
  <div class="formulario">
    <h1>Cadastro de Cliente</h1>
    <form id="cadastroForm" novalidate>
      <label>
        <p></p>Nome completo:
        <input type="text" id="nome" name="nome">
        <div class="error" id="erroNome"></div>
      </label>

      <label>
        E-mail:
        <input type="email" id="email" name="email">
        <div class="error" id="erroEmail"></div>
      </label>

      <label>
        CPF:
        <input type="text" id="cpf" name="cpf" maxlength="11">
        <div class="error" id="erroCpf"></div>
      </label>

      <div class="doisLabels">
        <label>
          Data de nascimento:
          <input type="date" id="nascimento" name="nascimento">
          <div class="error" id="erroNascimento"></div>
        </label>

        <label>
          Telefone (opcional):
          <input type="text" id="telefone" name="telefone" maxlength="11">
          <div class="error" id="erroTelefone"></div>
        </label>
      </div>
      
      <label>
        Endereço:
        <input type="text" id="endereco" name="endereco">
        <div class="error" id="erroEndereco"></div>
      </label>

      <button type="submit">Cadastrar</button>
      <div class="success" id="mensagemSucesso"></div>
    </form>
  </div>

  <script src="./app.js"></script>

</body>

</html>
